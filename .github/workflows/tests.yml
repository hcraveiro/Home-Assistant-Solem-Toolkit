name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acknowledgements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - run: python -m pytest -q --cov=custom_components.solem_toolkit.api --cov-report=term-missing
