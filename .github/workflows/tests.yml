name: Tests
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  acknowledgements:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements-test.txt
      - run: python -m pip install -r requirements-test.txt
      - name: Reinstall dbus-fast without Cython extensions
        run: SKIP_CYTHON=1 python -m pip install --force-reinstall --no-deps --no-binary=dbus-fast dbus-fast==5.0.22
      - run: python -m pytest -q --cov=custom_components.solem_toolkit --cov-report=term-missing --cov-report=xml:coverage.xml --cov-fail-under=70
