list_characteristics:
  description: "List characteristics of device"
  fields:
    device_mac:
      description: "Device's MAC address"
      example: "00:11:22:33:44:55"
    model:
      description: "Optional device model (bl_ip by default; blnr experimental)."
      example: "bl_ip"
      default: "bl_ip"
      selector:
        select:
          options:
            - "bl_ip"
            - "blnr"
    version:
      description: "Optional firmware or model version (informational only)."
      example: "5.1.7"

