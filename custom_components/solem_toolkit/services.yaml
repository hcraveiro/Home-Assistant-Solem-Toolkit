read_status:
  description: "Read device status without changes. BL-IP returns decoded values and an event; BLNR experimentally returns raw protocol bytes without decoded battery/state."
  fields:
    device_mac:
      description: "Device's MAC address"
      example: "00:11:22:33:44:55"
    model:
      description: "Optional device model (bl_ip by default; bl_nr experimental)."
      example: "bl_ip"
      default: "bl_ip"
      selector:
        select:
          options:
            - "bl_ip"
            - "bl_nr"
    version:
      description: "Optional firmware or model version (informational only)."
      example: "5.1.7"

read_info_block:
  description: "Read a raw BLNR device information block by index (experimental, read-only)."
  fields:
    device_mac:
      description: "Device's MAC address"
      required: true
      example: "00:11:22:33:44:55"
    model:
      description: "Must be blnr."
      required: true
      selector:
        select:
          options:
            - "bl_nr"
    index:
      description: "Information block index (0-255)."
      default: 1
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: box
    bluetooth_timeout:
      description: "Bluetooth connection timeout in seconds."
      default: 10

read_station_config:
  description: "Read a raw BLNR station/program configuration block by index (experimental, read-only)."
  fields:
    device_mac:
      description: "Device's MAC address"
      required: true
      example: "00:11:22:33:44:55"
    model:
      description: "Must be blnr."
      required: true
      selector:
        select:
          options:
            - "bl_nr"
    index:
      description: "Station/program configuration block index (0-255)."
      default: 2
      selector:
        number:
          min: 0
          max: 255
          step: 1
          mode: box
    bluetooth_timeout:
      description: "Bluetooth connection timeout in seconds."
      default: 10
